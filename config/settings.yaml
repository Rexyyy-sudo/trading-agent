# ============================================================
# trading-agent default configuration.
# Every value here is optional: built-in defaults are used for
# anything missing. Environment variables may override secrets
# only (API keys) - never data or analysis parameters.
# ============================================================

app:
  log_level: INFO
  data_dir: data

providers:
  # Tried in order for `--provider auto`. Providers that need a key
  # are skipped automatically when the key is missing.
  priority: [twelvedata, binance, yahoo, csv]
  csv_dir: data/raw
  request_timeout: 15
  default_limit: 500

symbols:
  # Timeframes used when the user does not specify them.
  default_timeframes: [H1, M15, M5]
  # Automatically add higher/lower timeframes around a single
  # requested timeframe (e.g. "M5" -> H1 / M15 / M5).
  auto_multi_timeframe: true
  timeframe_roles:
    H1: htf
    M15: mtf
    M5: ltf

analysis:
  min_bars: 120
  swing_lookback: 3
  ema_fast: 20
  ema_slow: 50
  ema_trend: 200
  rsi_period: 14
  atr_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2.0
  sr_cluster_tolerance_atr: 0.6
  sr_max_zones_per_side: 4
  equal_level_tolerance_atr: 0.2
  liquidity_lookback_swings: 12
  volatility_lookback: 200
  # ATR ratio thresholds: current ATR / median ATR of the lookback window.
  volatility_low_ratio: 0.75
  volatility_high_ratio: 1.3
  volatility_extreme_ratio: 1.8

scoring:
  # Weights must be >= 0. They are normalised automatically over the
  # components that have sufficient data.
  weights:
    structure: 0.30
    liquidity: 0.20
    momentum: 0.15
    trend: 0.15
    support_resistance: 0.10
    volatility: 0.05
    volume: 0.05
  # Upper bounds for WEAK / MIXED / MODERATE / STRONG
  label_thresholds: [40, 60, 75, 90]

decision:
  long_threshold: 65
  short_threshold: 65
  # Minimum number of timeframes that must agree with the bias.
  min_timeframe_alignment: 2
  # Require the entry timeframe to confirm (structure or momentum).
  ltf_confirmation_required: true
  # What extreme news risk does to a signal: NO TRADE or WAIT
  news_extreme: "NO TRADE"
  news_high: WAIT
  volatility_extreme: WAIT

risk:
  default_balance: 10000
  default_risk_pct: 1.0
  max_risk_pct: 2.0
  sl_method: structure      # structure | atr
  atr_sl_multiplier: 1.5
  structure_buffer_atr: 0.5
  rr_targets: [1.0, 2.0, 3.0]
  warn_rr_below: 1.5

paper:
  starting_balance: 10000
  storage_path: data/paper/account.json

news:
  provider: none            # none | local | finnhub
  local_calendar: data/news/calendar.json
  lookahead_hours: 24
  window_hours: 2
  extreme_keywords:
    [fomc, "federal funds rate", "interest rate decision", "rate decision",
     "nonfarm payroll", nfp, cpi, "consumer price index", powell]
  high_keywords:
    [ppi, "producer price index", gdp, pce, "retail sales", "unemployment rate",
     ecb, boe, boj, fed, "central bank", "inflation", "jobless claims"]
